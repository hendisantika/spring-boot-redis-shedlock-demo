# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # Gradle dependencies (build.gradle.kts) and Gradle Wrapper
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "java"
    assignees:
      - "hendisantika"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "io.spring.dependency-management"
      shedlock:
        patterns:
          - "net.javacrumbs.shedlock*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "org.springframework.boot*"
          - "io.spring.dependency-management"
          - "net.javacrumbs.shedlock*"
          - "org.testcontainers*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github_actions"
    assignees:
      - "hendisantika"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker images in compose.yaml
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "hendisantika"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # Stay on PostgreSQL 17; only take minor/patch & alpine base bumps
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
